name: Unpack Linux Mobile 0.9 ULTRA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    name: Extract Linux Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Linux Mobile ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 3 -type f \
            \( -name 'Linux_Mobile_0.9_ULTRA.zip' -o -name 'Linux_Mobile.zip' \) \
            | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "::error::Linux Mobile ZIP not found."
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

      - name: Backup existing workflows
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/existing-workflows

          if [ -d ".github/workflows" ]; then
            mkdir -p /tmp/existing-workflows
            cp -a .github/workflows/. /tmp/existing-workflows/
          fi

      - name: Extract Linux Mobile
        shell: bash
        run: |
          set -euo pipefail

          rm -rf .linux-mobile-unpack
          mkdir -p .linux-mobile-unpack

          echo "Extracting:"
          echo "$ZIP_PATH"

          unzip -q -o "$ZIP_PATH" -d .linux-mobile-unpack

          echo "Archive extracted."

          # Detect a single top-level directory.
          TOP_LEVEL_COUNT="$(find .linux-mobile-unpack \
            -mindepth 1 -maxdepth 1 | wc -l)"

          if [ "$TOP_LEVEL_COUNT" -eq 1 ]; then
            TOP_LEVEL="$(find .linux-mobile-unpack \
              -mindepth 1 -maxdepth 1)"

            if [ -d "$TOP_LEVEL" ]; then
              echo "Using top-level directory: $TOP_LEVEL"
              cp -a "$TOP_LEVEL"/. .
            else
              cp -a .linux-mobile-unpack/. .
            fi
          else
            cp -a .linux-mobile-unpack/. .
          fi

          rm -rf .linux-mobile-unpack

      - name: Restore existing workflows
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "/tmp/existing-workflows" ]; then
            mkdir -p .github/workflows

            rm -rf .github/workflows/*
            cp -a /tmp/existing-workflows/. .github/workflows/

            echo "Existing GitHub Actions workflows preserved."
          fi

      - name: Remove ZIP archives
        shell: bash
        run: |
          rm -f Linux_Mobile_0.9_ULTRA.zip
          rm -f Linux_Mobile.zip

      - name: Verify Linux Mobile structure
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/org/linox/mobile/MainActivity.kt"
            "app/src/main/java/org/linox/mobile/LinuxRuntime.kt"
            "app/src/main/java/org/linox/mobile/TerminalActivity.kt"
            "app/src/main/cpp/CMakeLists.txt"
            "app/src/main/cpp/pty_bridge.cpp"
            "settings.gradle.kts"
            "build.gradle.kts"
            "gradlew"
          )

          echo "Checking Linux Mobile project..."

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -e "$FILE" ]; then
              echo "::error::Missing required file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          if [ ! -x "gradlew" ]; then
            chmod +x gradlew
          fi

          echo ""
          echo "Linux Mobile 0.9 ULTRA structure: OK"

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "::warning::Gradle wrapper properties not found."
          else
            echo "Gradle wrapper detected."
          fi

      - name: Check Git changes
        shell: bash
        run: |
          git status --short

      - name: Commit Linux Mobile
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update Linux Mobile 0.9 ULTRA"

      - name: Push changes
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main

          echo ""
          echo "========================================"
          echo " Linux Mobile 0.9 ULTRA pushed!"
          echo "========================================"
