name: Build LinOx Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: linox-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Linux Mobile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The project does not commit a Gradle wrapper JAR.
      # Install the exact Gradle version required by AGP 8.9.x instead.
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4.4.3
        with:
          gradle-version: "8.11.1"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK / NDK / CMake
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-35"             "build-tools;35.0.0"             "ndk;27.0.12077973"             "cmake;3.22.1"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/pty_bridge.cpp
          test -f app/src/main/assets/proot-aarch64-static

          echo "=== Gradle ==="
          gradle --version

          echo "=== Toolchain files ==="
          find app/src/main -maxdepth 3 -type f | sort | sed -n '1,160p'

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle             clean             :app:assembleDebug             --stacktrace             --warning-mode all             --console=plain             2>&1 | tee build.log

      - name: Run Android lint
        if: success()
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug             --stacktrace             --warning-mode all             --console=plain             2>&1 | tee lint.log

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p release
          cp "$APK" "release/LinOx-Mobile-0.9.1-debug.apk"

          echo "=== APK ==="
          ls -lh "$APK"
          file "$APK"

          echo "=== Native libraries ==="
          unzip -l "$APK" | grep -E 'lib/[^/]+/liblinoxpty\.so$' || true

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-build-diagnostics
          path: |
            build.log
            lint.log
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-Mobile-0.9.1-debug
          path: release/LinOx-Mobile-0.9.1-debug.apk
          if-no-files-found: error
          retention-days: 30
