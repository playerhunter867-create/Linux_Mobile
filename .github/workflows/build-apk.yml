name: Build LinOx Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Checking Android project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Project OK."

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "Building with system Gradle 8.11.1..."
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find app/build/outputs -type f -name "*.apk" -print

          APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          cp "$APK" LinOx-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-debug-apk
          path: LinOx-debug.apk
          if-no-files-found: error
          retention-days: 14
