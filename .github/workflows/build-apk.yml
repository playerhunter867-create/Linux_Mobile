name: Build Linux Mobile APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Linux Mobile 0.9 ULTRA
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # CHECKOUT
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # JAVA
      # ============================================

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================
      # ANDROID
      # ============================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      # ============================================
      # VERIFY PROJECT
      # ============================================

      - name: Verify project
        run: |
          set -e

          REQUIRED_FILES=(
            "settings.gradle.kts"
            "build.gradle.kts"
            "app/build.gradle.kts"
            "app/src/main/AndroidManifest.xml"
            "app/src/main/java/org/linox/mobile/MainActivity.kt"
            "app/src/main/java/org/linox/mobile/LinuxRuntime.kt"
            "app/src/main/cpp/CMakeLists.txt"
            "app/src/main/cpp/pty_bridge.cpp"
            "gradlew"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "::error::Missing file: $FILE"
              exit 1
            fi

            echo "OK: $FILE"
          done

          chmod +x gradlew

      # ============================================
      # ENVIRONMENT
      # ============================================

      - name: Show environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo ""
          echo "===== GRADLE ====="
          ./gradlew --version

          echo ""
          echo "===== ANDROID SDK ====="
          echo "$ANDROID_HOME"

      # ============================================
      # CLEAN
      # ============================================

      - name: Clean
        run: |
          ./gradlew clean \
            --stacktrace \
            --console=plain

      # ============================================
      # KOTLIN DIAGNOSTIC BUILD
      # ============================================

      - name: Compile Kotlin
        id: kotlin
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:compileDebugKotlin \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee kotlin-build.log

      # ============================================
      # KOTLIN LOG
      # ============================================

      - name: Upload Kotlin log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-Kotlin-Error
          path: kotlin-build.log
          if-no-files-found: ignore
          retention-days: 14

      # ============================================
      # BUILD APK
      # ============================================

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee apk-build.log

      # ============================================
      # APK LOG
      # ============================================

      - name: Upload APK build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-APK-Error
          path: apk-build.log
          if-no-files-found: ignore
          retention-days: 14

      # ============================================
      # SEARCH APK
      # ============================================

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          if [ ! -d "app/build/outputs" ]; then
            echo "::error::app/build/outputs does not exist."
            echo ""
            echo "The APK build did not produce build outputs."
            exit 1
          fi

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find app/build/outputs \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p release

          cp "$APK" \
            "release/Linux-Mobile-0.9-ULTRA-debug.apk"

      # ============================================
      # APK INFORMATION
      # ============================================

      - name: APK information
        run: |
          echo "======================================"
          echo "Linux Mobile 0.9 ULTRA"
          echo "======================================"

          ls -lh \
            release/Linux-Mobile-0.9-ULTRA-debug.apk

          file \
            release/Linux-Mobile-0.9-ULTRA-debug.apk

      # ============================================
      # UPLOAD APK
      # ============================================

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-0.9-ULTRA-debug
          path: release/Linux-Mobile-0.9-ULTRA-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================
      # SUCCESS
      # ============================================

      - name: Success
        run: |
          echo ""
          echo "======================================"
          echo "BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "Linux Mobile 0.9 ULTRA APK:"
          echo "Linux-Mobile-0.9-ULTRA-debug.apk"
