name: Build Linux Mobile APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

          yes | sdkmanager --licenses || true

      # --------------------------------------------------
      # 4. Verify project
      # --------------------------------------------------

      - name: Check Linux Mobile project
        run: |
          set -e

          echo "Checking project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          test -f app/src/main/java/org/linox/mobile/MainActivity.kt
          test -f app/src/main/java/org/linox/mobile/LinuxRuntime.kt
          test -f app/src/main/java/org/linox/mobile/TerminalActivity.kt

          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/pty_bridge.cpp

          echo "Linux Mobile project structure OK."

      # --------------------------------------------------
      # 5. Gradle permissions
      # --------------------------------------------------

      - name: Make Gradle executable
        run: |
          chmod +x gradlew

      # --------------------------------------------------
      # 6. Clean
      # --------------------------------------------------

      - name: Clean project
        run: |
          ./gradlew clean

      # --------------------------------------------------
      # 7. Build Debug APK
      # --------------------------------------------------

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # 8. Find APK
      # --------------------------------------------------

      - name: Locate APK
        id: apk
        run: |
          set -e

          APK="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 9. Copy APK with friendly name
      # --------------------------------------------------

      - name: Prepare APK
        run: |
          mkdir -p release

          cp "${{ steps.apk.outputs.apk_path }}" \
             "release/Linux-Mobile-0.9-ULTRA-debug.apk"

          ls -lh release/

      # --------------------------------------------------
      # 10. Upload APK
      # --------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-0.9-ULTRA-APK
          path: release/Linux-Mobile-0.9-ULTRA-debug.apk
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------
      # 11. Upload complete build outputs
      # --------------------------------------------------

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-build-outputs
          path: |
            app/build/outputs/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
