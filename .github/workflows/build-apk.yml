name: Build Linux Mobile APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Show environment
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          ./gradlew --version

          echo "===== ANDROID ====="
          echo "$ANDROID_HOME"

          echo "===== SDK ====="
          sdkmanager --list | grep -E \
            "platforms;android|build-tools;|cmake;|ndk;" \
            | head -50

      - name: Verify project
        run: |
          set -eux

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f gradlew

          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/pty_bridge.cpp

          chmod +x gradlew

      - name: Inspect Gradle configuration
        run: |
          echo "===== settings.gradle.kts ====="
          cat settings.gradle.kts

          echo "===== root build.gradle.kts ====="
          cat build.gradle.kts

          echo "===== app/build.gradle.kts ====="
          cat app/build.gradle.kts

          echo "===== CMakeLists.txt ====="
          cat app/src/main/cpp/CMakeLists.txt

      - name: Clean
        run: |
          ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: |
          set -o pipefail

          ./gradlew \
            :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee gradle-build.log

      - name: Show important Gradle errors
        if: failure()
        run: |
          echo ""
          echo "========================================"
          echo " IMPORTANT BUILD ERRORS"
          echo "========================================"

          grep -n -E \
            "What went wrong|FAILED|Caused by:|error:|ERROR:|Exception|Could not|A problem occurred" \
            gradle-build.log \
            | tail -150 || true

      - name: Upload Gradle log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Find APK
        if: success()
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Prepare APK
        if: success()
        run: |
          mkdir -p release

          APK="$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          cp "$APK" \
            release/Linux-Mobile-0.9-ULTRA-debug.apk

          ls -lh release/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-0.9-ULTRA-debug
          path: release/Linux-Mobile-0.9-ULTRA-debug.apk
          if-no-files-found: error
          retention-days: 30
