name: Build LinOx Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show current Gradle wrapper
        run: |
          echo "Current wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Force Gradle 8.11.1
        shell: bash
        run: |
          set -e

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Updated wrapper:"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Check Gradle version
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" LinOx-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LinOx-debug-apk
          path: LinOx-debug.apk
          if-no-files-found: error
          retention-days: 14
