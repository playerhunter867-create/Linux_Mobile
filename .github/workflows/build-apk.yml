name: Build Linux Mobile APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          ./gradlew :app:assembleDebug \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "GRADLE_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          exit $EXIT_CODE

      - name: Extract real error
        if: always()
        run: |
          echo ""
          echo "=================================================="
          echo "              REAL GRADLE ERROR"
          echo "=================================================="

          if [ ! -f build.log ]; then
            echo "build.log does not exist."
            exit 0
          fi

          echo ""
          echo "----- WHAT WENT WRONG -----"

          awk '
            /What went wrong:/ {
              found=1
              count=0
            }

            found {
              print
              count++
            }

            found && count >= 80 {
              exit
            }
          ' build.log || true

          echo ""
          echo "----- CAUSED BY -----"

          grep -n -A 15 -B 3 \
            "Caused by:" \
            build.log \
            | tail -100 || true

          echo ""
          echo "----- COMPILER ERRORS -----"

          grep -n -E \
            "error:|ERROR:|FAILURE:|Exception:|Could not|failed|FAILED" \
            build.log \
            | tail -150 || true

          echo ""
          echo "----- LAST 100 LINES -----"

          tail -100 build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-Gradle-Log
          path: build.log
          retention-days: 14

      - name: Stop if build failed
        if: env.GRADLE_EXIT_CODE != '0'
        run: |
          echo "::error::Gradle build failed."
          echo "Open the 'REAL GRADLE ERROR' section above."
          exit 1

      - name: Locate APK
        run: |
          set -e

          APK="$(find app/build/outputs \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          echo "APK: $APK"

          mkdir -p release

          cp "$APK" \
            release/Linux-Mobile-0.9-ULTRA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Mobile-0.9-ULTRA-debug
          path: release/Linux-Mobile-0.9-ULTRA-debug.apk
          if-no-files-found: error
          retention-days: 30
