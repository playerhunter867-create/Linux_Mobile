name: Install fixed build pack

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "Linux_Mobile-fixed-build-pack.zip" ]; then
            ZIP_FILE="Linux_Mobile-fixed-build-pack.zip"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1 || true)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f \
              ! -path "./.git/*" \
              | sort
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract build pack
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _build_pack
          mkdir -p _build_pack

          echo "Extracting $ZIP_FILE..."

          unzip -q "$ZIP_FILE" -d _build_pack

          echo ""
          echo "Extracted files:"
          find _build_pack -maxdepth 4 -type f | sort

          SOURCE_DIR="_build_pack"

          if [ -d "_build_pack/Linux_Mobile-main" ]; then
            SOURCE_DIR="_build_pack/Linux_Mobile-main"
          fi

          echo ""
          echo "Using source directory: $SOURCE_DIR"

          cp -a "$SOURCE_DIR"/. .

          rm -rf _build_pack

      - name: Remove ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$ZIP_FILE"

          echo "ZIP removed."

      - name: Show project structure
        shell: bash
        run: |
          echo ""
          echo "Final project structure:"
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply fixed LinOx build pack"

          git push origin HEAD:main
