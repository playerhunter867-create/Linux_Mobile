name: Install fixed build pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE=""

          if [ -f "Linux_Mobile-fixed-build-pack.zip" ]; then
            ZIP_FILE="Linux_Mobile-fixed-build-pack.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract build pack
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _build_pack
          mkdir -p _build_pack

          echo "Extracting ZIP..."

          unzip -q "$ZIP_FILE" -d _build_pack

          echo "Extracted files:"
          find _build_pack -maxdepth 3 -type f | sort

          SOURCE_DIR="_build_pack"

          if [ -d "_build_pack/Linux_Mobile-main" ]; then
            SOURCE_DIR="_build_pack/Linux_Mobile-main"
          fi

          echo "Using source directory: $SOURCE_DIR"

          cp -a "$SOURCE_DIR"/. .

          rm -rf _build_pack

          echo "Final project structure:"
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            ! -name "*.zip" \
            | sort

      - name: Remove ZIP from repository
        shell: bash
        run: |
          rm -f "$ZIP_FILE"

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply fixed LinOx build pack"
          git push
