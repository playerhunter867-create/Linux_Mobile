name: Unpack LinOx ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            echo "Upload the fixed ZIP to the repository root first."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        run: |
          set -e

          rm -rf /tmp/linox-pack
          mkdir -p /tmp/linox-pack

          unzip -q "$ZIP" -d /tmp/linox-pack

          if [ -d "/tmp/linox-pack/Linux_Mobile-main" ]; then
            SOURCE="/tmp/linox-pack/Linux_Mobile-main"
          else
            SOURCE="/tmp/linox-pack"
          fi

          echo "Installing project from: $SOURCE"

          # Copy everything EXCEPT GitHub workflows.
          rsync -a \
            --exclude='.github/workflows/' \
            "$SOURCE/" \
            "./"

          rm -f "$ZIP"

      - name: Verify Android project
        run: |
          set -e

          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -d "app"

          echo "Android project detected successfully."
          echo ""
          echo "Project:"
          ls -la

      - name: Commit changes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Install fixed LinOx project"
          git push origin HEAD:main
