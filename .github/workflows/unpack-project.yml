name: Unpack LinOx Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP
        shell: bash
        run: |
          set -e

          if [ -f "Linux_Mobile-fixed-build-pack.zip" ]; then
            ZIP="Linux_Mobile-fixed-build-pack.zip"
          else
            ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf _unpack
          mkdir _unpack

          unzip -q "$ZIP" -d _unpack

          if [ -d "_unpack/Linux_Mobile-main" ]; then
            cp -a _unpack/Linux_Mobile-main/. .
          else
            cp -a _unpack/. .
          fi

          rm -rf _unpack
          rm -f "$ZIP"

      - name: Show project
        shell: bash
        run: |
          echo "Project files:"
          find . -maxdepth 4 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit and push
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi

          git commit -m "Install LinOx fixed build pack"
          git push origin main
