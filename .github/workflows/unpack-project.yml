name: Install fixed build pack

on:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for build pack..."

          ZIP_FILE=""

          if [ -f "Linux_Mobile-fixed-build-pack.zip" ]; then
            ZIP_FILE="Linux_Mobile-fixed-build-pack.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: ZIP file was not found."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 3 -type f | sort
            echo ""
            echo "Upload Linux_Mobile-fixed-build-pack.zip to the repository root"
            echo "and run this workflow again."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP contents:"
          unzip -l "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract build pack
        shell: bash
        run: |
          set -euo pipefail

          echo "Extracting: $ZIP_FILE"

          unzip -o "$ZIP_FILE" -d .

          echo ""
          echo "Extraction completed."

      - name: Show changed files
        shell: bash
        run: |
          echo "Repository files after extraction:"
          find . -maxdepth 5 -type f \
            ! -path "./.git/*" \
            | sort

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Apply fixed build pack"
          git push
